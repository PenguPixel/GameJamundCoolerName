<div class="level-controls" data-level-controls hidden>
    <section class="level-controls__panel" aria-labelledby="level-controls-title">
        <h1 class="level-controls__title" id="level-controls-title">controls</h1>

        <dl class="level-controls__list">
            <div class="level-controls__row">
                <dt><kbd>WASD</kbd> / <kbd>arrow keys</kbd></dt>
                <dd>move</dd>
            </div>
            <div class="level-controls__row">
                <dt><kbd>R</kbd></dt>
                <dd>swap character</dd>
            </div>
            <div class="level-controls__row">
                <dt><kbd>P</kbd></dt>
                <dd>pause</dd>
            </div>
        </dl>

        <button class="level-controls__button" type="button" data-level-controls-continue>continue</button>
    </section>
</div>

<div class="level-intro" data-level-intro hidden>
    <h1 class="level-intro__title" data-level-intro-title></h1>
</div>
